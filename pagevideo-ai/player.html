<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageVideo Player</title><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}video{width:100%;height:100%;object-fit:contain}</style></head><body><video id="v" controls playsinline preload="metadata"></video><script>const u=new URLSearchParams(location.search).get("src");if(u)document.getElementById("v").src=u;else document.body.innerHTML='<p style="color:white;text-align:center;padding:30px;font-family:system-ui">URL de vídeo não informada.</p>';</script></body></html>
