name: Viva Rede Android

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: VivaRede
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: viva-rede-debug
          path: VivaRede/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error